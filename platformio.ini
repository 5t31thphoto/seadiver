; ============================================================
;  Mantis Seadiver — M5Stack Core2 (Arduino + M5Unified)
;  a submarine through an ocean that dreams itself
; ============================================================
[env:m5stack-core2]
platform = espressif32@6.9.0
board = m5stack-core2
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
board_build.partitions = default.csv
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DMP_LCD_MHZ=40
; our hot loops run faster at -O2; the framework and libraries keep -Os so the app stays small
build_src_flags =
    -O2
    -fno-math-errno
; everything pinned to the first green build, so an update can't change or break it
platform_packages =
    platformio/framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
lib_deps =
    m5stack/M5Unified@0.2.28
    m5stack/M5GFX@0.2.35
monitor_filters = esp32_exception_decoder
extra_scripts = post:merge_bin.py
